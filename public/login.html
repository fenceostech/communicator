<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · FenceOS Console</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --line:#243040; --ink:#e8eef5; --ink-2:#9fb0c3;
    --accent:#4c9ffe; --accent-ink:#08131f; --crit:#ff6b6b; --radius:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:
    radial-gradient(1200px 600px at 20% -10%,#16324f33,transparent),
    radial-gradient(900px 500px at 100% 120%,#4c9ffe22,transparent),var(--bg);
    color:var(--ink);font-family:var(--font)}
  .card{width:min(400px,92vw);background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:28px 26px;box-shadow:0 20px 60px #0008}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(180deg,#4c9ffe,#2f6fd0);color:#fff}
  .mark svg{width:20px;height:20px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{display:block;font-size:11.5px;color:var(--ink-2)}
  h1{font-size:17px;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:var(--ink-2);font-size:12.5px}
  label{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0e141b;color:var(--ink);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  button{width:100%;margin-top:18px;padding:11px 12px;border:0;border-radius:9px;
    background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:12.5px;
    background:#3a1414;border:1px solid #5a1f1f;color:#ffb4b4}
  .hint{margin-top:16px;font-size:11.5px;color:var(--ink-2);text-align:center;line-height:1.5}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V8l3-4 3 4v13M14 21V8l3-4 3 4v13"/><path d="M2 12h20M2 16.5h20"/></svg></div>
      <div><b>FenceOS</b><span>Setup Console</span></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Use your console account to continue.</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required placeholder="you@company.com" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required placeholder="••••••••" autocomplete="current-password" />

    <button id="submit" type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>

<script>
  const form = document.getElementById('loginForm')
  const err = document.getElementById('err')
  const btn = document.getElementById('submit')

  function nextUrl() {
    const p = new URLSearchParams(location.search).get('next')
    if (p && p.startsWith('/') && !p.startsWith('//')) return p
    return '/'
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    err.style.display = 'none'
    btn.disabled = true
    btn.textContent = 'Signing in…'
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) {
        err.textContent = data.error || 'Sign in failed'
        err.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'Sign in'
        return
      }
      location.href = nextUrl()
    } catch {
      err.textContent = 'Network error — please try again'
      err.style.display = 'block'
      btn.disabled = false
      btn.textContent = 'Sign in'
    }
  })
</script>
</body>
</html>
