<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Accept your invite · FenceOS Communicator</title>
<style>
  :root{ --bg:#F4F6F6; --panel:#fff; --line:#DCE3E3; --ink:#101617; --ink-2:#4A5658; --ink-3:#78888A;
    --accent:#0F6F77; --accent-hov:#0B565C; --crit:#A02B21; --ok:#256D4A; --r:12px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--font)}
  .card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;box-shadow:0 1px 2px rgba(16,22,23,.05),0 12px 32px -16px rgba(16,22,23,.25)}
  .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(180deg,#12868f,#0F6F77);color:#fff;margin-bottom:16px}
  .mark svg{width:20px;height:20px}
  h1{font-size:19px;margin:0 0 4px}
  p.sub{margin:0 0 16px;color:var(--ink-2);font-size:13px}
  label{display:block;font-size:12px;color:var(--ink-2);margin:12px 0 6px}
  input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;outline:none}
  input:focus{border-color:var(--accent)}
  input:disabled{background:#F1F4F4;color:var(--ink-3)}
  button{width:100%;margin-top:18px;padding:11px 12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{background:var(--accent-hov)}
  button:disabled{opacity:.6;cursor:default}
  .msg{display:none;margin-top:14px;padding:10px 12px;border-radius:9px;font-size:12.5px}
  .msg.err{background:#FAE6E3;border:1px solid #E3A69E;color:#7d201a}
  .msg.ok{background:#E1EFE7;border:1px solid #98C6AE;color:#1c5236}
  .hint{margin-top:8px;font-size:11.5px;color:var(--ink-3)}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21V8l3-4 3 4v13M14 21V8l3-4 3 4v13"/><path d="M2 12h20M2 16.5h20"/></svg></div>
    <h1>Set your password</h1>
    <p class="sub" id="sub">Checking your invite…</p>

    <div id="fields" style="display:none">
      <label for="email">Email</label>
      <input id="email" type="email" disabled />
      <label for="password">Create a password</label>
      <input id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" placeholder="Re-enter password" autocomplete="new-password" />
      <button id="go" type="submit">Set password &amp; sign in</button>
    </div>

    <div class="msg" id="msg"></div>
  </form>

<script>
  const qs = new URLSearchParams(location.search)
  const token = qs.get('token') || ''
  const $ = (id) => document.getElementById(id)
  const showMsg = (text, kind) => { const m = $('msg'); m.textContent = text; m.className = 'msg ' + kind; m.style.display = 'block' }

  async function init() {
    if (!token) { $('sub').textContent = 'This invite link is missing its token.'; return }
    try {
      const res = await fetch('/api/invite?token=' + encodeURIComponent(token))
      const data = await res.json().catch(() => ({}))
      if (!res.ok || !data.valid) { $('sub').textContent = data.error || 'This invite link is invalid.'; return }
      $('sub').textContent = 'Welcome' + (data.name ? ', ' + data.name : '') + '! Choose a password to finish setting up your account.'
      $('email').value = data.email
      $('fields').style.display = 'block'
      $('password').focus()
    } catch (e) { $('sub').textContent = 'Could not check your invite. Please try again later.' }
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const password = $('password').value || ''
    const confirm = $('confirm').value || ''
    if (password.length < 8) return showMsg('Password must be at least 8 characters.', 'err')
    if (password !== confirm) return showMsg('Passwords do not match.', 'err')
    const btn = $('go'); btn.disabled = true; btn.textContent = 'Setting up…'
    try {
      const res = await fetch('/api/invite/accept', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password }),
      })
      const data = await res.json().catch(() => ({}))
      if (!res.ok) { showMsg(data.error || 'Could not set your password.', 'err'); btn.disabled = false; btn.textContent = 'Set password & sign in'; return }
      showMsg('Success! Signing you in…', 'ok')
      setTimeout(() => { location.href = '/' }, 700)
    } catch (e) { showMsg('Network error — please try again.', 'err'); btn.disabled = false; btn.textContent = 'Set password & sign in' }
  })

  init()
</script>
</body>
</html>
