/* ================= BASE ================= */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.015em;font-weight:600}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--disp);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.hide{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ================= SHELL ================= */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;padding:20px 18px 16px}
.logo{width:170px;height:53px;background-image:var(--logo);background-size:contain;background-repeat:no-repeat;background-position:left center}
.logo.sm{width:132px;height:41px}
.mark{width:28px;height:28px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.mark svg{width:17px;height:17px}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-txt b{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:-.02em}
.brand-txt span{font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
.nav{padding:4px 10px;display:flex;flex-direction:column;gap:1px}
.nav-sec{padding:14px 8px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s}
.nav a:hover{background:var(--panel-2);color:var(--ink)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a svg{width:16px;height:16px;flex:none;opacity:.85}
.nav .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px;font-family:var(--disp)}
.nav a.on .badge{background:var(--crit)}
.rail-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line)}
.who{display:flex;align-items:center;gap:9px;padding:6px}
.av{width:26px;height:26px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--disp);font-size:10.5px;font-weight:700;color:var(--ink-2);flex:none}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px;height:53px}
.crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.crumb span{opacity:.55}
.topbar .sp{margin-left:auto}
.view{padding:22px 22px 60px;max-width:1500px;width:100%}
.view.flush{padding:0;max-width:none;flex:1;min-height:0}

/* ================= PRIMITIVES ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;transition:background .12s,border-color .12s,opacity .12s;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:var(--accent-hov);border-color:var(--accent-hov)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:5px}
.btn.lg{padding:10px 18px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;font-family:var(--disp);letter-spacing:.005em;border:1px solid transparent;white-space:nowrap}
.chip .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.c-run{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.c-warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.c-crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.c-hand{background:var(--hand-soft);color:var(--hand);border-color:var(--hand-line)}

.sum span{font-size:11.5px;color:var(--ink-3)}

/* ================= AUDIT ================= */
.audit-row{cursor:pointer}
.audit-detail td{background:var(--panel-2);padding:0 !important}
.audit-detail .inner{padding:13px 15px 15px 44px}
.audit-detail pre{font-family:var(--mono);font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;overflow-x:auto;margin:0;line-height:1.6;color:var(--ink-2)}
.filters{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.filters .btn.sm.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.srch{position:relative;flex:1;max-width:260px}
.srch input{width:100%;padding:6px 10px 6px 29px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--panel);font-size:12.5px}
.srch svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--ink-3)}

/* ================= CHAT ================= */
.chat{position:fixed;top:0;right:0;bottom:0;width:392px;max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;z-index:60;transform:translateX(100%);transition:transform .24s cubic-bezier(.4,0,.2,1)}
.chat.open{transform:none}
.chat-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.dtab{flex:1;padding:7px;font-size:12.5px;font-weight:600;border-radius:var(--r-sm);color:var(--ink-3);font-family:var(--disp);display:flex;align-items:center;justify-content:center;gap:6px}
.dtab.on{background:var(--accent-soft);color:var(--accent)}
.dtab .badge{background:var(--crit);color:#fff;font-size:10px;padding:0 5px;border-radius:20px}
.team-pane{flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.thread{display:flex;gap:10px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
.thread:hover{background:var(--panel-2)}
.thread b{font-size:13px;font-weight:600;display:block}
.thread .sub{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.thread .badge{background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px;font-family:var(--disp)}
.thead{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.thead b{font-size:13px}
.tmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.tm{max-width:82%;align-self:flex-start}
.tm .tb{background:var(--panel-2);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:13px;line-height:1.5}
.tm time{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);margin-top:3px;display:block}
.tm.me{align-self:flex-end}
.tm.me .tb{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:12px 12px 3px 12px}
.tm.me time{text-align:right}
.chat-head{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:none}
.chat-head .ai{width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.chat-head .ai svg{width:15px;height:15px}
.chat-head .sp{margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:9px;animation:slidein .22s ease-out}
.msg .mi{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-family:var(--disp);font-size:9.5px;font-weight:700}
.msg.a .mi{background:var(--accent);color:var(--accent-ink)}
.msg.a .mi svg{width:13px;height:13px}
.msg.u .mi{background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.msg .mb{font-size:13px;line-height:1.55;min-width:0;flex:1;color:var(--ink)}
.msg.u .mb{color:var(--ink-2)}
.msg .mb p+p{margin-top:8px}
.msg .mb code{font-family:var(--mono);font-size:12px;background:var(--sunken);padding:1px 4px;border-radius:3px}
.msg .mb ul{margin:7px 0 0;padding-left:16px}
.msg .mb li{margin-bottom:3px}
.msg-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 10px}
.chips button{font-size:11.5px;padding:4px 9px;border:1px solid var(--line-2);border-radius:20px;color:var(--ink-2);background:var(--panel);transition:border-color .12s,color .12s}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chat-foot{padding:11px 13px;border-top:1px solid var(--line);flex:none}
.composer{display:flex;gap:7px;align-items:flex-end;border:1px solid var(--line-2);border-radius:var(--r);padding:6px 6px 6px 11px;background:var(--panel);transition:border-color .12s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{flex:1;border:0;background:none;resize:none;font-size:13px;padding:4px 0;max-height:96px;outline:none;line-height:1.45}
.composer .send{width:28px;height:28px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.composer .send svg{width:14px;height:14px}
.fab{position:fixed;right:20px;bottom:20px;z-index:50;display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:26px;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lg);font-weight:600;font-size:13px;font-family:var(--disp)}
.fab svg{width:16px;height:16px}

/* ================= MODAL ================= */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:grid;place-items:center;padding:20px;backdrop-filter:blur(2px);animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:86vh;overflow-y:auto;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{padding:17px 19px 13px;display:flex;gap:12px;align-items:flex-start}
.modal-head .mi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.modal-head .mi svg{width:17px;height:17px}
.modal-body{padding:0 19px 17px}
.modal-foot{padding:14px 19px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
.modal-foot .sp{margin-left:auto}
.spec{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.spec .sh{padding:7px 11px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
.spec pre{font-family:var(--mono);font-size:11.5px;padding:11px;margin:0;overflow-x:auto;color:var(--ink-2);line-height:1.6}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:22px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:pop .22s ease-out}
.toast svg{width:14px;height:14px}

/* ================= RESPONSIVE ================= */
.mobtabs{display:none}
@media (max-width:1180px){
  .ws{grid-template-columns:230px 1fr}
  .ws-col.right{position:fixed;top:53px;right:0;bottom:0;width:322px;z-index:40;transform:translateX(100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .ws-col.right.open{transform:none}
  .grid-2{grid-template-columns:1fr}
}
@media (max-width:1240px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .fields{grid-template-columns:1fr}
  .featgrid{grid-template-columns:1fr}
}
@media (max-width:760px){
  :root{--rail:0px}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:80;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-lg)}
  .rail.open{transform:none}
  .menu-btn{display:inline-grid !important}
  .view{padding:15px 14px 80px}
  .topbar{padding:0 13px}
  .step .lbl{display:none}
  .step .bar{margin:0 5px}
  .ver-hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:14px}
  .chat{width:100%}
  .fab span{display:none}
  .fab{padding:13px;border-radius:50%}
  .ws{display:block;height:auto}
  .ws-col.left,.ws-col.right{position:static;transform:none;border:0;box-shadow:none;width:auto;border-bottom:1px solid var(--line)}
  .ws-col.left,.ws-col.right{display:none}
  .ws-col.left.mob,.ws-col.right.mob,.ws-col.mid.mob{display:flex}
  .ws-body{overflow:visible}
  .logwrap{overflow:visible}
  .mobtabs{display:flex;gap:4px;padding:7px 13px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:53px;z-index:20}
  .mobtabs button{flex:1;padding:6px;font-size:12px;font-weight:600;border-radius:var(--r-sm);color:var(--ink-3);font-family:var(--disp)}
  .mobtabs button.on{background:var(--accent-soft);color:var(--accent)}
  .grid-2{grid-template-columns:1fr}
  .hide-sm{display:none !important}
}
.menu-btn{display:none}
.gate{min-height:calc(100vh - 53px);display:grid;place-items:center;padding:30px 20px}
.gate-card{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:30px 28px}
.gate-quick{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.appicon{width:24px;height:24px;border-radius:6px;background-size:contain;background-repeat:no-repeat;background-position:center;flex:none}
.brandprev{width:110px;height:56px;flex:none;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);display:grid;place-items:center;overflow:hidden;padding:6px}
.brandprev.on-dark{background:#12181A;border-color:#2A3435}
.brandprev img{max-width:100%;max-height:100%;object-fit:contain}
.sq.haslogo{background:var(--panel)!important;border-color:var(--line)!important;padding:2px;overflow:hidden}
.sq.haslogo img{width:100%;height:100%;object-fit:contain}
.tplrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line);position:relative;background:var(--panel)}
.tplrow:last-of-type{border-bottom:0}
.tplrow .grip{flex:none;display:grid;place-items:center;padding:0 4px 0 11px;color:var(--line-2);cursor:grab;align-self:center}
.tplrow .grip:active{cursor:grabbing}
.tplrow:hover .grip{color:var(--ink-3)}
.tplrow.dragging{opacity:.4}
.tplrow.over-top::before,.tplrow.over-bottom::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
.tplrow.over-top::before{top:-1px}
.tplrow.over-bottom::after{bottom:-1px}
.tplrow .movers{display:flex;flex-direction:column;gap:1px;flex:none;justify-content:center;padding:0 4px;opacity:0;transition:opacity .12s}
.tplrow:hover .movers{opacity:1}
.tplrow .movers .btn:disabled{opacity:.25}
.item.tplrow{align-items:flex-start;padding:9px 15px 9px 0}
.gh{display:flex;align-items:stretch;border-bottom:1px solid transparent}
.gh.open{border-bottom-color:var(--line)}
.gtick{flex:none;width:38px;display:grid;place-items:center;background:none;border:0;cursor:pointer}
.gtick::before{content:"";width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line-2);position:absolute}
.gtick{position:relative;color:#fff}
.gtick svg{position:relative;z-index:1}
.gtick.on::before{background:var(--ok);border-color:var(--ok)}
.gtick.part::before{background:var(--accent-soft);border-color:var(--accent)}
.gtick i{position:relative;z-index:1;width:7px;height:2px;background:var(--accent);border-radius:2px;display:block}
.glink{flex:none;display:grid;place-items:center;padding:0 14px;color:var(--ink-3);border:0;background:none;text-decoration:none;transition:color .12s}
.glink:hover{color:var(--accent)}
.gmain{flex:1;min-width:0;display:flex;gap:10px;align-items:center;padding:13px 15px 13px 0;background:none;border:0;text-align:left;cursor:pointer}
.gmain:hover b{color:var(--accent)}
.gmain b{font-family:var(--disp);font-size:14px;font-weight:600;display:block}
.gsrc{font-size:11px;color:var(--ink-3);font-family:var(--mono);display:block;margin-top:1px}
.gmain .caret{color:var(--ink-3);transition:transform .16s}
.gh.open .caret{transform:rotate(90deg)}
.gdesc{font-size:12.5px;color:var(--ink-2);padding:12px 15px 10px;line-height:1.5;max-width:72ch}
.item{display:flex;gap:11px;padding:9px 15px;border-top:1px solid var(--line);align-items:flex-start}
.item.conflict{background:var(--crit-soft)}
.tick{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);background:var(--panel);display:grid;place-items:center;cursor:pointer;margin-top:1px;color:#fff;transition:background .12s,border-color .12s,transform .1s;padding:0}
.tick:hover{border-color:var(--accent);transform:scale(1.08)}
.tick.on{background:var(--ok);border-color:var(--ok)}
.ibody{flex:1;min-width:0}
.ibody b{font-size:13px;font-weight:500;display:block;line-height:1.35}
.ibody b.checked{color:var(--ink-2)}
.ihint{font-size:11.5px;color:var(--ink-3);display:block;margin-top:1px}
.ifound{font-size:11.5px;display:flex;align-items:flex-start;gap:5px;margin-top:4px;color:var(--crit);line-height:1.45}
.ifound svg{flex:none;margin-top:2px}
/* interactive checklist row */
.srow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.ci-btn{flex:none;display:grid;place-items:center;padding:11px 0 11px 15px;background:none;border:0;cursor:pointer}
.ci-btn .ci{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;transition:transform .12s}
.ci-btn:hover .ci{transform:scale(1.15)}
.ci-btn .ci svg{width:11px;height:11px;color:#fff}
.row-main{flex:1;min-width:0;display:flex;gap:11px;align-items:center;padding:11px 15px;background:none;border:0;text-align:left;cursor:pointer;transition:background .1s}
.row-main:hover{background:var(--panel-2)}
.row-main b{font-size:13px;font-weight:500;display:block}
.srow.done .row-main b{color:var(--ink-2)}
.srow.block .row-main b,.srow.human .row-main b{font-weight:600}
.row-main .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;display:block}
.row-main .caret{color:var(--ink-3);flex:none;transition:transform .16s}
.srow.open .row-main .caret{transform:rotate(90deg)}
.status-set{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.status-set button{font-size:11.5px;padding:3px 9px;border:1px solid var(--line-2);border-radius:20px;background:var(--panel);color:var(--ink-2);font-family:var(--disp);font-weight:600;transition:border-color .12s,color .12s}
.status-set button:hover{border-color:var(--accent);color:var(--accent)}
.status-set button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* notes */
.note{padding:11px 15px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .nhead{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.note .nhead b{font-size:12px;font-weight:600}
.note .nhead time{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.note .nhead .acts{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.note:hover .nhead .acts{opacity:1}
.note p{font-size:12.5px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap}
.note textarea{width:100%;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;resize:vertical;min-height:58px;outline:none}
.note-new{padding:12px 15px;border-top:1px solid var(--line);background:var(--panel-2);border-radius:0 0 var(--r) var(--r)}
.note-new textarea{width:100%;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px;resize:vertical;min-height:60px;transition:border-color .12s}
.note-new textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.snap{display:flex;gap:14px;padding:15px;border-bottom:1px solid var(--line);align-items:flex-start}
.snap:last-of-type{border-bottom:0}
.snap .sv{font-family:var(--disp);font-size:13px;font-weight:700;padding:3px 9px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);flex:none}
.snap.old .sv{background:var(--sunken);color:var(--ink-3);border-color:var(--line)}
.manifest{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.manifest div{display:flex;flex-direction:column}
.manifest b{font-family:var(--disp);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.manifest span{font-size:11px;color:var(--ink-3)}
</style>
</head>

function bindGate(){
  const go=async()=>{
    const email=($('#gEmail').value||'').trim();
    const password=($('#gPass')?$('#gPass').value:'')||'';
    const err=$('#gErr'), btn=$('#gGo');
    if(!email||!password){ if(err){err.textContent='Enter your email and password.';err.style.display='block';} return; }
    if(btn){ btn.disabled=true; }
    const res = window.__fosAuth ? await window.__fosAuth.login(email,password) : {ok:false,error:'Auth unavailable'};
    if(!res.ok){ if(err){err.textContent=res.error||'Sign in failed.';err.style.display='block';} if(btn) btn.disabled=false; }
    // on success __fosAuth.login reloads the page as the new user
  };
  if($('#gGo')) $('#gGo').onclick=go;
  const em=$('#gEmail'), pw=$('#gPass');
  if(em) em.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(pw&&!pw.value){pw.focus();return;} go(); } });
  if(pw) pw.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}

  modal(`<div class="modal" role="dialog" aria-modal="true" style="width:min(440px,100%)">

    <div class="modal-body">

      <div class="f" style="margin-top:10px"><label for="gPass">Password</label><input id="gPass" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password"></div>

    </div>

/* ---------- theme ---------- */
function getTheme(){ try{return localStorage.getItem('fos-theme')||'system'}catch(e){return 'system'} }
function setTheme(t){
  try{localStorage.setItem('fos-theme',t)}catch(e){}
  if(t==='system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  paintThemeBtn();
  if(typeof applyBrand==='function') applyBrand();
}
function paintThemeBtn(){
  const t=getTheme();
  const dark = t==='dark' || (t==='system' && matchMedia('(prefers-color-scheme:dark)').matches);
  $('#themeBtn').innerHTML = ic(dark?'sun':'moon',16);
  $('#themeBtn').title = 'Theme: '+t+' — click to change';
}

/* ---------- toast ---------- */
let toastT;
function toast(msg,kind){
  clearTimeout(toastT);
  $('#toastRoot').innerHTML = `<div class="toast">${ic(kind==='bad'?'alert':'check',14)}<span>${msg}</span></div>`;
  toastT = setTimeout(()=>$('#toastRoot').innerHTML='',2600);
}
function modal(html){ $('#modalRoot').innerHTML = `<div class="scrim" data-scrim>${html}</div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; }

    $('#nav').innerHTML = `<div class="nav-sec eyebrow">Workspace</div>`+navItem(NAV[0],'dashboard');

<script>
/* ============================================================
   SIMULATION ENGINE
   ============================================================ */
let clockMin = 602; // 10:02
const stamp=()=>{const h=Math.floor(clockMin/60),m=clockMin%60;return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
const GLYPH={run:'dot',ok:'check',warn:'alert',warnl:'alert',faill:'x',hand:'hand'};
function appendLog(t,lg,head){
  clockMin += 1 + Math.floor(Math.random()*2);
  let html='';
  if(head) html += `<div class="log-head">${t.n}</div>`;
  const k = lg.k==='warn'?'warnl':lg.k;
  html += `<div class="logline ${k}"><time>${stamp()}</time><span class="gl">${ic(GLYPH[k]||'dot',11)}</span><span class="m">${lg.m}${lg.tech?`<span class="tech">${esc(lg.tech)}</span>`:''}</span></div>`;
  if(head && t.stages) html += `<div class="logline"><time></time><span class="gl"></span><span class="m"><div class="stage-chips">${t.stages.map(s=>`<span class="sc">${s}</span>`).join('')}</div></span></div>`;
  S.run.logs.push({html, task:t.n, kind:k, time:stamp(), msg:lg.m.replace(/<[^>]+>/g,''), tech:lg.tech||''});
  const w=$('#logwrap');
  if(w){ if(w.querySelector('p.dim')) w.innerHTML=''; w.insertAdjacentHTML('beforeend',html); w.scrollTop=w.scrollHeight; }
}
function repaintWork(){
  const rl=$('#runline'); if(rl){ rl.innerHTML=runlineHTML();
    $$('[data-task]').forEach(b=>b.onclick=()=>{ S.run.sel=b.dataset.task; repaintWork(); }); }
  const an=$('#agentNow'); if(an){ an.innerHTML=agentNowHTML(); an.classList.toggle('working',S.run.state==='running'); }
  const ip=$('#insp'); if(ip){ ip.innerHTML=inspHTML(); ip.classList.toggle('open',S.inspOpen); ip.classList.toggle('mob',S.mobPane==='right'); }
  const dc=$('.ws-col.left .ws-head .dim'); if(dc) dc.textContent=`${doneCount()}/${TASKS.length}`;
  bindWorkControls();
  $('#chatCtx').textContent=chatCtx();
  paintNav();
}
const wait=ms=>{clearTimeout(S.run.timer); S.run.timer=setTimeout(()=>{ if(S.run.state==='running') step(); }, ms/S.run.speed);};

function runStep(){ rebuildAudit(S.acct||ACCOUNTS[0].id); S.run.state='running'; S.run.cur=0; S.run.li=0; step(); }
function step(){
  if(S.run.state!=='running') return;
  const t=TASKS[S.run.cur];
  if(!t){ S.run.state='done'; repaintWork(); toast('Setup run finished'); return; }
  if(t.mode==='approval' && !S.run.approved[t.id]){ S.run.ts[t.id]='wait'; S.run.state='blocked'; S.run.sel=t.id; repaintWork(); openApproval(t); return; }
  const st0=S.run.ts[t.id];
  if(st0==='pend'||st0==='wait'){ S.run.ts[t.id]='run'; S.run.li=0; S.run.sel=t.id; repaintWork(); }
  else if(st0==='hand'){ S.run.ts[t.id]='run'; S.run.sel=t.id; repaintWork(); }
  const logs = (t.id==='t11' && S.run.fixed) ? t.altLogs : t.logs;
  if(S.run.li>=logs.length){
    (t.clears||[]).forEach(k=>{ delete FIND[S.acct||ACCOUNTS[0].id][k]; });
    S.run.ts[t.id]='done'; S.run.cur++; S.run.li=0; repaintWork(); wait(500); return; }
  const lg=logs[S.run.li];
  appendLog(t,lg,S.run.li===0);
  S.run.li++;
  if(t.mode==='handoff' && S.run.li===1 && !S.run.approved[t.id]){
    S.run.ts[t.id]='hand'; S.run.state='blocked'; repaintWork(); openHandoff(t); return;
  }
  wait(950);
}
const _unusedAlt=[
  {k:'run',m:'Re-checking phone numbers on the subaccount&hellip;',tech:'GET /v1/phone-numbers/?locationId=loc_3Ax8Qm\n→ [ { "number": "+15550100188", "areaCode": "812", "capabilities": ["voice","sms"] } ]'},
  {k:'ok',m:'Number <b>(555) 010-0188</b> assigned and set as the primary line',tech:'PUT /v1/locations/loc_3Ax8Qm  primaryPhone = +15550100188'},
  {k:'ok',m:'IVR menu built — 4 options, business-hours routing',tech:'1 → New estimate    → Voice AI agent agent_Vx2\n2 → Existing job    → forward usr_Ev3\n3 → Billing         → voicemail-to-text\n0 → Operator        → forward usr_Ev3\nAfter hours → Voice AI agent, then voicemail-to-text'},
  {k:'ok',m:'AI receptionist attached to the number and answering'}
];

/* ---------- approval + handoff ---------- */
function openApproval(t){
  const risky = t.id==='t11';
  modal(`<div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="mi" style="background:var(--warn-soft);color:var(--warn)">${ic('shield',17)}</div>
      <div style="flex:1"><h2>Approval required</h2>
      <p class="muted" style="font-size:13px;margin-top:3px">The agent wants to ${t.id==='t10'?'submit the A2P 10DLC brand and campaign':'configure the phone number and call routing'}</p></div>
    </div>
    <div class="modal-body">
      <dl class="kv" style="margin-bottom:4px">
        <dt>Task</dt><dd>${t.n}</dd>
        <dt>Subaccount</dt><dd>${esc(S.form.bname)} — FenceOS <span class="mono dim" style="font-size:11.5px">loc_3Ax8Qm</span></dd>
        <dt>Confidence</dt><dd class="num">${t.conf}%</dd>
        <dt>Reversible</dt><dd>${t.id==='t10'?'No — a submitted campaign cannot be withdrawn without re-registering':'Yes — routing can be changed at any time'}</dd>
      </dl>
      <div class="alertbox" style="margin-top:13px"><h4>Why this needs you</h4>
        <p>${t.id==='t10'
          ? 'A2P registration submits this business&rsquo;s legal name, EIN and sample messages to the carriers. A rejected brief costs days and a re-submission fee, and the details come from the client, not from me.'
          : 'Provisioning a number bills the agency and changes how calls to this business are answered. I don&rsquo;t make billing decisions on my own.'}</p></div>
      <div class="spec"><div class="sh"><span class="eyebrow">Exactly what I will send</span></div>
        <pre>${esc(t.logs[t.id==='t10'?1:0].tech)}</pre></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="mReject">Reject</button>

function openFinding(f,a){

      ${isMarked(a.id,f.k)&&f.v!=='client'?`<div class="alertbox crit" style="margin-top:13px"><h4>${ic('alert',13)} Marked done, but not found</h4>
        <p>You ticked this item, and the agent could not verify it in the subaccount. Either it was saved somewhere else, or it did not save at all.</p></div>`:''}

}

const arrMove=(arr,from,to)=>{ const [x]=arr.splice(from,1); arr.splice(to,0,x); };
function makeSortable(sel, attr, onMove){
  let from=null;
  const clear=()=>$$(sel).forEach(x=>x.classList.remove('over-top','over-bottom'));
  $$(sel).forEach(el=>{
    el.setAttribute('draggable','true');
    el.addEventListener('dragstart',e=>{ from=+el.dataset[attr]; el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',String(from));}catch(_){} });
    el.addEventListener('dragend',()=>{ el.classList.remove('dragging'); clear(); from=null; });
    el.addEventListener('dragover',e=>{
      e.preventDefault(); e.dataTransfer.dropEffect='move';
      const i=+el.dataset[attr]; if(from===null||i===from){ return; }
      const r=el.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
      clear(); el.classList.add(after?'over-bottom':'over-top');
    });
    el.addEventListener('drop',e=>{
      e.preventDefault();
      const i=+el.dataset[attr]; if(from===null||i===from){ clear(); return; }
      const r=el.getBoundingClientRect(); const after=(e.clientY-r.top)>r.height/2;
      let to=after?i+1:i; if(from<to) to--;
      clear(); onMove(from,to);
    });
  });
}

        <button class="btn pri" id="bUrlSave">Save</button></div></div>`);
    $('#bUrl').focus();
    $('#bUrlSave').onclick=()=>{ const v=($('#bUrl').value||'').trim();
      if(v && !/^https?:\/\/|^data:image\//i.test(v)){ toast('Enter a full https:// image URL','bad'); return; }
      BRAND[k]=v; closeModal(); applyBrand(); render(); toast(v?'Image set':'Image removed'); };
  });
  $$('[data-bclr]').forEach(b=>b.onclick=()=>{ BRAND[b.dataset.bclr]=''; applyBrand(); render(); toast('Reverted to the built-in artwork'); });
  const cb=$('#commSave');
  if(cb) cb.onclick=()=>{
    const v=($('#commBase').value||'').trim().replace(/\/+$/,'');
    if(!/^https?:\/\/[^\s/]+\.[^\s/]+/i.test(v)){ toast('Enter a full URL, e.g. https://app.yourdomain.com','bad'); return; }
    COMM.base=v; render(); toast('Communicator address saved');
  };
  $$('[data-recon]').forEach(b=>b.onclick=()=>toast('Not wired up yet — this is where the OAuth flow would start','bad'));
  $$('[data-tplg]').forEach(b=>b.onclick=()=>{ S.tplG=b.dataset.tplg; render(); window.scrollTo(0,0); });
  const moveGroup=(f,t)=>{ if(t<0||t>=GROUPS.length||f===t) return; arrMove(GROUPS,f,t); reindex(); render(); toast('Checklist order updated'); };
  makeSortable('[data-grow]','grow',moveGroup);
  $$('[data-gup]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); moveGroup(+b.dataset.gup, +b.dataset.gup-1); });
  $$('[data-gdown]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); moveGroup(+b.dataset.gdown, +b.dataset.gdown+1); });
  const gEdit=S.tplG?GROUPS.find(x=>x.id===S.tplG):null;
  if(gEdit){
    const moveItem=(f,t)=>{ if(t<0||t>=gEdit.items.length||f===t) return; arrMove(gEdit.items,f,t); reindex(); render(); toast('Item order updated'); };
    makeSortable('[data-irow]','irow',moveItem);
    $$('[data-iup]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); moveItem(+b.dataset.iup, +b.dataset.iup-1); });
    $$('[data-idown]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); moveItem(+b.dataset.idown, +b.dataset.idown+1); });
  }
  const ga=$('#gAdd');
  if(ga) ga.onclick=()=>{
    const nm=$('#gName'), sr=$('#gSrc');
    const v=(nm.value||'').trim(); if(!v){ nm.focus(); return; }
    const id='g'+Math.random().toString(36).slice(2,6);
    GROUPS.push({id, n:v, src:(sr.value||'').trim()||'\u2014', link:'', d:'Added to the template by '+TEAM[0].n+'.', items:[]});
    PH_OF[id]=3; reindex(); S.tplG=id; render(); toast('“'+v+'” added — now add its items');
  };
  $$('[data-gdel]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const gid=b.dataset.gdel, g=GROUPS.find(x=>x.id===gid);
    modal(`<div class="modal" role="dialog" aria-modal="true" style="width:min(460px,100%)">
      <div class="modal-head"><div class="mi" style="background:var(--crit-soft);color:var(--crit)">${ic('alert',17)}</div>
        <div style="flex:1"><h2>Remove “${g.n}”?</h2>
        <p class="muted" style="font-size:13px;margin-top:3px">${g.items.length} item${g.items.length===1?'':'s'}</p></div></div>
      <div class="modal-body"><p class="muted" style="font-size:13px">This checklist disappears from all ${ACCOUNTS.length} subaccounts, and anything already ticked on it stops counting toward readiness.</p></div>
      <div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><div class="sp"></div>
        <button class="btn danger" id="gDelYes">${ic('x')}Remove checklist</button></div></div>`);
    $('#gDelYes').onclick=()=>{
      closeModal();
      g.items.forEach(it=>ACCOUNTS.forEach(a=>MARKS[a.id].delete(key(gid,it.id))));
      const i=GROUPS.findIndex(x=>x.id===gid); if(i>-1) GROUPS.splice(i,1);
      if(S.tplG===gid) S.tplG=null;
      reindex(); render(); toast('“'+g.n+'” removed from the template');
    };
  });
  const back=$('#tplBack'); if(back) back.onclick=()=>{ S.tplG=null; render(); };
  $$('[data-mflag]').forEach(b=>b.onclick=()=>{
    const [gid,iid]=b.dataset.mflag.split(':');
    const it=GROUPS.find(g=>g.id===gid).items.find(x=>x.id===iid);
    it.m = it.m?0:1; reindex(); render();
    toast(it.m?'Now a manual check':'The agent will verify this');
  });
  $$('[data-idel]').forEach(b=>b.onclick=()=>{
    const [gid,iid]=b.dataset.idel.split(':');
    const g=GROUPS.find(x=>x.id===gid);
    g.items=g.items.filter(x=>x.id!==iid);
    ACCOUNTS.forEach(a=>MARKS[a.id].delete(key(gid,iid)));
    reindex(); render(); toast('Item removed from the template');
  });
  const add=$('#tplAdd');
  if(add) add.onclick=()=>{
    const nm=$('#tplName'), ht=$('#tplHint');
    const v=(nm.value||'').trim(); if(!v){ nm.focus(); return; }
    const g=GROUPS.find(x=>x.id===S.tplG);
    const id='x'+Math.random().toString(36).slice(2,6);
    g.items.push({id, n:v, h:(ht.value||'').trim()||undefined});
    reindex(); render(); toast('Added to '+g.n);
  };
  const inv=$('#tmInvite'); if(inv) inv.onclick=()=>{ S.inviting=true; render(); setTimeout(()=>{const e=$('#tmName'); if(e)e.focus();},60); };
  const cx=$('#tmCancel'); if(cx) cx.onclick=()=>{ S.inviting=false; render(); };
  const sv=$('#tmSave');
  if(sv) sv.onclick=()=>{
    const n=($('#tmName').value||'').trim(), r=($('#tmRole').value||'').trim(), e=($('#tmEmail').value||'').trim();
    if(!n){ $('#tmName').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(e)){ toast('Enter a valid email address','bad'); $('#tmEmail').focus(); return; }
    TEAM.push({n, r:r||'Communication Specialist', e, role:'Specialist', owns:'Subaccount builds',
               init:n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()});
    S.inviting=false; render(); toast(n+' added to the team');
  };
  $$('[data-tmdel]').forEach(b=>b.onclick=()=>confirmRemove(+b.dataset.tmdel));
  $$('[data-cad]').forEach(b=>b.onclick=()=>{ PREFS.cadence=b.dataset.cad; render(); toast('Audit schedule updated'); });
  $$('[data-pref]').forEach(b=>b.onclick=()=>{ PREFS[b.dataset.pref]=!PREFS[b.dataset.pref]; render(); });
}
</script>
<script>
/* ============================================================
   DRAWER — two tabs
   Agent : answers only about subaccount status
   Team  : messages between signed-in people
   ============================================================ */
const ACT = (label,fn,pri)=>`<button class="btn sm ${pri?'pri':''}" data-act="${fn}">${label}</button>`;
const MSGS = [
  {id:1, from:'Alex Moreno', to:'Ryan Malaluan', at:'Yesterday 4:12 PM', text:'Family Fencing DNS records are with the developer now. Should land tomorrow.'},
  {id:2, from:'Sam Okonkwo', to:'Ryan Malaluan', at:'Today 9:05 AM', text:'Jack Fencing still has no number. Can you authorise the purchase?'}
];
let msgSeq = 3;
const threadsFor = who => {
  const names=[...new Set(MSGS.filter(m=>m.to===who||m.from===who).map(m=>m.from===who?m.to:m.from))];
  return names.map(n=>({with:n, msgs:MSGS.filter(m=>(m.from===n&&m.to===who)||(m.from===who&&m.to===n))}));
};
const unreadFor = who => MSGS.filter(m=>m.to===who && !m.read).length;

/* ---------- agent: subaccount status only ---------- */
function findAcct(q){
  const t=q.toLowerCase();
  return ACCOUNTS.find(a=>t.includes(a.name.toLowerCase()))
      || ACCOUNTS.find(a=>a.name.toLowerCase().split(/\s+/).some(w=>w.length>3&&t.includes(w)));
}
function statusAnswer(a){
  const inc=incompleteOf(a.id), fnd=openFindings(a.id), pct=readiness(a.id);
  const byG={}; inc.forEach(x=>{ byG[x.g.n]=(byG[x.g.n]||0)+1; });
  const top=Object.entries(byG).sort((x,y)=>y[1]-x[1]).slice(0,3);
  return {m:`<p><b>${esc(a.name)}</b> — ${STATUS[acctStage(a.id)].l}, <b>${pct}% complete</b>.</p>
    <p>${markedCount(a.id)} of ${TOTAL_ITEMS} checklist items done, ${inc.length} outstanding.${fnd.length?` ${fnd.length} carry a note from the last audit.`:''}</p>
    ${top.length?`<p>Most outstanding:</p><ul>${top.map(([n,c])=>`<li>${n} — ${c} item${c===1?'':'s'}</li>`).join('')}</ul>`:''}
    ${latestNote(a.id)?`<p class="dim" style="font-size:12px">Blocker: ${esc(latestNote(a.id))}</p>`:''}`,
    acts:[ACT('Open '+esc(a.name.split(' ')[0]),'go:'+a.id,1)]};
}
function agentReply(q){
  const t=q.toLowerCase();
  const a=findAcct(q);
  if(a) return statusAnswer(a);
  if(/(all|every|overall|summary|which|who|list|behind|stuck|blocked|worst|attention)/.test(t)){
    const rows=ACCOUNTS.map(x=>({x,p:readiness(x.id),i:incompleteOf(x.id).length})).sort((m,n)=>m.p-n.p).slice(0,5);
    return {m:`<p>Lowest five by completion:</p><ul>${rows.map(r=>`<li><b>${esc(r.x.name)}</b> — ${r.p}%, ${r.i} outstanding${r.x.block!=='none'?` · blocked on ${BLOCK[r.x.block].l.toLowerCase()}`:''}</li>`).join('')}</ul>`,
      acts:[ACT('Open findings','findings',1)]};
  }
  return {m:`<p>I only answer questions about subaccount status — completion, what is outstanding, and what is blocking a build.</p>
    <p class="dim" style="font-size:12px">Try naming a subaccount, for example &ldquo;status of Bee Fencing&rdquo;, or ask which accounts are furthest behind. For anything else, use the Team tab to message a person.</p>`,acts:[]};
}
function ask(q){ pushMsg('u',esc(q)); setTimeout(()=>{ const r=agentReply(q);
  pushMsg('a', r.m + (r.acts&&r.acts.length?`<div class="msg-act">${r.acts.join('')}</div>`:'')); },340); }
function pushMsg(who,html){
  S.msgs.push({who,html});
  const el=$('#msgs'); if(!el) return;
  el.insertAdjacentHTML('beforeend',`<div class="msg ${who}"><div class="mi">${who==='a'?ic('bot',13):(SESSION.user?SESSION.user.init:'ME')}</div><div class="mb">${html}</div></div>`);
  el.scrollTop=el.scrollHeight; bindMsgActs();
}
function bindMsgActs(){
  $$('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='findings'){ closeChat(); go('verify'); }
    else if(a.startsWith('go:')){ closeChat(); S.acct=a.slice(3); S.view='account'; render(); window.scrollTo(0,0); }
  });
}

/* ---------- drawer rendering ---------- */
function paintDrawer(){
  const me=SESSION.user;
  $('#chatTabs').innerHTML = `
    <button class="dtab ${S.dtab==='agent'?'on':''}" data-dt="agent">Ask the agent</button>
    <button class="dtab ${S.dtab==='team'?'on':''}" data-dt="team">Messages${me&&unreadFor(me.n)?` <span class="badge">${unreadFor(me.n)}</span>`:''}</button>`;
  $$('[data-dt]').forEach(b=>b.onclick=()=>{ S.dtab=b.dataset.dt; S.thread=null; paintDrawer(); });
  const agent = S.dtab==='agent';
  $('#chatCtx').textContent = agent ? chatCtx() : (me?`Signed in as ${me.n}`:'Not signed in');
  $('#chips').style.display = agent?'':'none';
  $('#msgs').style.display = agent?'':'none';
  $('#teamPane').style.display = agent?'none':'';
  $('#composer').style.display = (agent || (me && S.thread)) ? '' : 'none';
  $('#chatInput').placeholder = agent ? 'Ask about a subaccount\u2019s status\u2026' : 'Write a message\u2026';
  if(!agent) paintTeam();
}
function paintTeam(){
  const me=SESSION.user, el=$('#teamPane');
  if(!me){ el.innerHTML = `<div class="pad"><p class="dim" style="font-size:13px">Sign in to send and read messages.</p>
    <button class="btn pri sm" style="margin-top:10px" onclick="closeChat();openSignIn()">Sign in</button></div>`; return; }
  if(S.thread){
    const msgs=MSGS.filter(m=>(m.from===S.thread&&m.to===me.n)||(m.from===me.n&&m.to===S.thread));
    MSGS.forEach(m=>{ if(m.from===S.thread&&m.to===me.n) m.read=true; });
    el.innerHTML = `<div class="thead"><button class="btn sm ghost" id="thBack">&larr;</button><b>${esc(S.thread)}</b></div>
      <div class="tmsgs">${msgs.length?msgs.map(m=>`<div class="tm ${m.from===me.n?'me':''}">
        <div class="tb">${esc(m.text)}</div><time>${m.at}</time></div>`).join(''):'<p class="dim" style="font-size:12.5px;padding:12px 15px">No messages yet.</p>'}</div>`;
    $('#thBack').onclick=()=>{ S.thread=null; paintDrawer(); };
    const tm=el.querySelector('.tmsgs'); if(tm) tm.scrollTop=tm.scrollHeight;
    return;
  }
  const others=TEAM.filter(m=>m.n!==me.n);
  const th=threadsFor(me.n);
  el.innerHTML = `<div class="pad" style="padding:11px 15px 6px"><span class="eyebrow">Conversations</span></div>
    ${others.map(o=>{
      const t=th.find(x=>x.with===o.n), last=t&&t.msgs[t.msgs.length-1];
      const un=MSGS.filter(m=>m.from===o.n&&m.to===me.n&&!m.read).length;
      return `<button class="thread" data-th="${esc(o.n)}">
        <span class="av">${o.init}</span>
        <span style="flex:1;min-width:0"><b>${esc(o.n)}</b>
          <span class="sub">${last?esc(last.text).slice(0,52)+(last.text.length>52?'\u2026':''):'No messages yet'}</span></span>
        ${un?`<span class="badge">${un}</span>`:''}</button>`;}).join('')}`;
  $$('[data-th]').forEach(b=>b.onclick=()=>{ S.thread=b.dataset.th; paintDrawer(); paintNav(); });
}
function sendTeamMsg(text){
  const me=SESSION.user; if(!me||!S.thread) return;
  MSGS.push({id:msgSeq++, from:me.n, to:S.thread, at:'Just now', text, read:false});
  paintDrawer();
}

const CHIPS=['Status of Bee Fencing','Which accounts are furthest behind?','What is outstanding on Jack Fencing?'];
function openChat(){ S.chatOpen=true; $('#chat').classList.add('open');
  if(!S.msgs.length && S.dtab==='agent'){ pushMsg('a',`<p>I answer questions about subaccount status &mdash; how complete a build is, what is outstanding, and what is blocking it. Name a subaccount to start.</p>`); }
  paintDrawer();
  setTimeout(()=>{const i=$('#chatInput'); if(i&&$('#composer').style.display!=='none') i.focus();},240); }
function closeChat(){ S.chatOpen=false; $('#chat').classList.remove('open'); }

/* ============================================================
   INIT
   ============================================================ */
$('#chips').innerHTML = CHIPS.map(c=>`<button data-chip="${esc(c)}">${esc(c)}</button>`).join('');
$$('[data-chip]').forEach(b=>b.onclick=()=>ask(b.dataset.chip));
$('#chatBtn').onclick=()=>S.chatOpen?closeChat():openChat();
$('#fab').onclick=()=>S.chatOpen?closeChat():openChat();
$('#chatClose').onclick=closeChat;
$('#chatSend').onclick=()=>{ const i=$('#chatInput'); const v=(i.value||'').trim(); if(!v)return;
  if(S.dtab==='team') sendTeamMsg(v); else ask(v);
  i.value=''; i.style.height='auto'; };
$('#chatInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#chatSend').click(); } });
$('#chatInput').addEventListener('input',e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,96)+'px'; });
$('#themeBtn').onclick=()=>{ const t=getTheme(); setTheme(t==='system'?'dark':t==='dark'?'light':'system'); };
$('#menuBtn').onclick=()=>$('#rail').classList.toggle('open');
document.addEventListener('click',e=>{
  if(e.target.dataset&&e.target.dataset.scrim!==undefined) closeModal();
  if(window.innerWidth<=760 && !e.target.closest('#rail') && !e.target.closest('#menuBtn')) $('#rail').classList.remove('open');
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeModal(); if(S.chatOpen) closeChat(); } });
document.body.addEventListener('click',e=>{ const b=e.target.closest('#techBtn'); if(b) toggleTech(); });
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{paintThemeBtn();applyBrand();});
setTheme(getTheme());
render();
</script>
<script>
/* ============================================================
   PERSISTENCE — keep user changes across refreshes AND devices.
   Runs after the main script (classic scripts share globals).
   - localStorage: instant, offline cache (includes the per-device sign-in).
   - /api/state (Supabase): shared workspace synced across devices.
   Volatile UI (current view, in-flight run, modals, chat) is not persisted.
   If the state API is unavailable, the app still works from localStorage.
   ============================================================ */
(function () {
  const API = '/api/state';
  let uid = null;
  const localKey = () => 'fos-state-v2-' + (uid || 'anon');

  // Set instances (S.feats, MARKS[aid]) survive JSON via a small marker.
  const replacer = (k, v) => (v instanceof Set ? { __set: [...v] } : v);
  const reviver = (k, v) => (v && v.__set ? new Set(v.__set) : v);
  const reviveSets = (obj) => JSON.parse(JSON.stringify(obj), reviver);

  const fillObj = (target, src) => {
    if (!src || typeof src !== 'object') return;
    Object.keys(target).forEach((k) => delete target[k]);
    Object.assign(target, src);
  };
  const fillArr = (target, src) => {
    if (!Array.isArray(src)) return;
    target.length = 0;
    src.forEach((x) => target.push(x));
  };

  const isAdmin = () => !!(SESSION.user && SESSION.user.role === 'Owner');

  // Shared workspace. Notes live separately (/api/notes) so member note-adds
  // aren't clobbered by the owner's full-state saves.
  function snapshot() {
    return {
      S: { feats: S.feats, form: S.form, useRec: S.useRec, tech: S.tech, setTab: S.setTab },
      ACCOUNTS, MARKS, FIND, OVERRIDE, SNAPSHOTS, TEAM, PREFS, BRAND, COMM, ACTIVITY,
    };
  }

  function apply(data) {
    if (!data) return;
    if (data.S) {
      if (data.S.feats instanceof Set) S.feats = data.S.feats;
      if (data.S.form) S.form = data.S.form;
      if ('useRec' in data.S) S.useRec = data.S.useRec;
      if ('tech' in data.S) S.tech = data.S.tech;
      if (data.S.setTab) S.setTab = data.S.setTab;
    }
    if (data.ACCOUNTS) fillArr(ACCOUNTS, data.ACCOUNTS);
    if (data.MARKS) fillObj(MARKS, data.MARKS);
    if (data.FIND) fillObj(FIND, data.FIND);
    if (data.OVERRIDE) fillObj(OVERRIDE, data.OVERRIDE);
    if (data.SNAPSHOTS) fillArr(SNAPSHOTS, data.SNAPSHOTS);
    if (data.TEAM) fillArr(TEAM, data.TEAM);
    if (data.PREFS) fillObj(PREFS, data.PREFS);
    if (data.BRAND) fillObj(BRAND, data.BRAND);
    if (data.COMM && data.COMM.base) COMM = data.COMM;
    if (Array.isArray(data.ACTIVITY)) fillArr(ACTIVITY, data.ACTIVITY);
  }

  function saveLocal() {
    try { localStorage.setItem(localKey(), JSON.stringify(snapshot(), replacer)); } catch (e) {}
  }
  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(localKey()) || 'null', reviver); } catch (e) { return null; }
  }
  async function saveServer() {
    try {
      const data = JSON.parse(JSON.stringify(snapshot(), replacer)); // plain JSON w/ Set markers
      await fetch(API, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data }),
        keepalive: true,
      });
    } catch (e) {}
  }
  async function loadServer() {
    try {
      const res = await fetch(API, { cache: 'no-store' });
      if (!res.ok) return null;
      const j = await res.json();
      return j && j.data != null ? reviveSets(j.data) : null;
    } catch (e) { return null; }
  }

  const fmtNoteDate = (iso) => { try { return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } };

  async function loadNotes() {
    try {
      const res = await fetch('/api/notes', { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      const by = {};
      (j.notes || []).forEach((n) => {
        (by[n.account_id] = by[n.account_id] || []).push({ id: n.id, text: n.text, who: n.author, at: fmtNoteDate(n.created_at), ts: new Date(n.created_at).getTime() });
      });
      Object.keys(NOTES).forEach((k) => delete NOTES[k]);
      (Array.isArray(ACCOUNTS) ? ACCOUNTS : []).forEach((a) => {
        // Keep the seed "blocker" note (from a.note) as read-only context, then real notes on top.
        const seed = a.note ? [{ id: 'seed-' + a.id, text: a.note, who: 'System', at: a.created || '', ts: 0, seed: true }] : [];
        NOTES[a.id] = seed.concat(by[a.id] || []);
      });
      Object.keys(by).forEach((k) => { if (!NOTES[k]) NOTES[k] = by[k]; });
    } catch (e) {}
  }

  // Notes API — add is allowed for everyone; edit/delete require owner (server-enforced).
  window.__fosNote = {
    async add(accountId, text) {
      try {
        const res = await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accountId, text }) });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) return { ok: false, error: j.error || 'Could not add note' };
        const n = j.note;
        if (!Array.isArray(NOTES[accountId])) NOTES[accountId] = [];
        NOTES[accountId].push({ id: n.id, text: n.text, who: n.author, at: fmtNoteDate(n.created_at), ts: new Date(n.created_at).getTime() });
        return { ok: true };
      } catch (e) { return { ok: false, error: 'Network error' }; }
    },
    async del(accountId, id) {
      try {
        const res = await fetch('/api/notes/' + id, { method: 'DELETE' });
        if (!res.ok) { const j = await res.json().catch(() => ({})); return { ok: false, error: j.error || 'Could not delete note' }; }
        if (Array.isArray(NOTES[accountId])) NOTES[accountId] = NOTES[accountId].filter((x) => x.id != id);
        return { ok: true };
      } catch (e) { return { ok: false, error: 'Network error' }; }
    },
    async edit(accountId, id, text) {
      try {
        const res = await fetch('/api/notes/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
        if (!res.ok) { const j = await res.json().catch(() => ({})); return { ok: false, error: j.error || 'Could not update note' }; }
        if (Array.isArray(NOTES[accountId])) { const nn = NOTES[accountId].find((x) => x.id == id); if (nn) nn.text = text; }
        return { ok: true };
      } catch (e) { return { ok: false, error: 'Network error' }; }
    },
  };

  // Saving the shared workspace is owner-only; members never write it.
  let t, ready = false;
  function scheduleSave() {
    if (!ready || !isAdmin()) return;
    clearTimeout(t);
    t = setTimeout(() => { saveLocal(); saveServer(); }, 500);
  }

  function mapUser(u) {
    const owner = u.role === 'admin';
    return { id: u.id, n: u.name, e: u.email, role: owner ? 'Owner' : 'Specialist', r: owner ? 'Owner' : 'Specialist', init: u.initials };
  }

  // Persist on every change (no-ops until signed in + initial load complete).
  if (typeof render === 'function') {
    const _render = render;
    render = function () { const out = _render.apply(this, arguments); scheduleSave(); return out; };
  }

  async function fetchMe() {
    try { const r = await fetch('/api/auth/me', { cache: 'no-store' }); if (!r.ok) return null; return await r.json(); }
    catch (e) { return null; }
  }

  async function hydrate() {
    uid = SESSION.user.id;
    apply(loadLocal());                  // instant cache
    applyBrand && applyBrand(); render();
    const data = await loadServer();     // shared workspace (read-only for members)
    if (data) apply(data);
    await loadNotes();                   // notes from their own store
    applyBrand && applyBrand(); render();
    ready = true;
    if (isAdmin()) { saveLocal(); if (!data) saveServer(); }  // owner seeds/persists
  }

  window.__fosAuth = {
    async login(email, password) {
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) return { ok: false, error: j.error || 'Sign in failed' };
        location.reload();               // reinitialize cleanly as the new user
        return { ok: true };
      } catch (e) { return { ok: false, error: 'Network error' }; }
    },
    async logout() {
      try { await fetch('/api/auth/logout', { method: 'POST' }); } catch (e) {}
      location.reload();
    },
  };

  // Boot: restore the session from the cookie, then load that user's workspace.
  (async () => {
    const u = await fetchMe();
    if (u && u.id) { SESSION.user = mapUser(u); S.view = 'dashboard'; await hydrate(); }
    else { SESSION.user = null; render(); }
  })();

  window.addEventListener('beforeunload', () => { if (ready && isAdmin()) { saveLocal(); saveServer(); } });

  window.fosResetState = function () {
    try { localStorage.removeItem(localKey()); } catch (e) {}
    location.reload();
  };
})();
</script>
